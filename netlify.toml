[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev"

[functions]
  node_bundler = "esbuild"
  included_files = ["assets/fonts/*.ttf"]
  external_node_modules = ["@prisma/client", "exceljs"]

# The Mini App is a single page app under /app/
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/app/"
  status = 302

[[headers]]
  for = "/app/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app/index.html"
  [headers.values]
    Cache-Control = "no-cache"
